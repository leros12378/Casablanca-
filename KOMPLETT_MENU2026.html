<script>
var T=1,C="Vorspeisen",S={};try{S=JSON.parse(localStorage.getItem("zorbas_menu26")||"{}")}catch(e){}
function euro(x){return Number(x).toLocaleString("de-DE",{style:"currency",currency:"EUR"})}
function sv(){try{localStorage.setItem("zorbas_menu26",JSON.stringify(S))}catch(e){}}
function add(n,p){if(!S[T])S[T]=[];S[T].push({n:n,p:+p});sv();bot()}
function custom(n){var x=prompt(n+" – Betrag in Euro","");if(x===null)return;var p=parseFloat(x.replace(",","."));if(p>0)add(n,p);else alert("Ungültiger Betrag")}
function sm(a){var m={};a.forEach(x=>{var k=x.n+"|"+x.p;m[k]=(m[k]||0)+1});return Object.keys(m).map(k=>{var z=k.split("|"),q=m[k];return q+"× "+z[0]+" = "+euro(q*+z[1])})}
function bot(){var a=S[T]||[];ord.innerHTML=a.length?sm(a).join("<br>"):"Noch keine Bestellung";tl.textContent="T"+T;tot.textContent=euro(a.reduce((s,x)=>s+x.p,0));document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("on",+b.dataset.t===T))}
function fil(){var s=q.value.toLowerCase().trim();document.querySelectorAll(".it").forEach(b=>{var ok=s?(b.dataset.n+" "+b.dataset.code).toLowerCase().includes(s):b.dataset.c===C;b.style.display=ok?"block":"none"});document.querySelectorAll(".cb").forEach(b=>b.classList.toggle("on",b.dataset.c===C))}
document.querySelectorAll(".tb").forEach(b=>b.addEventListener("click",()=>{T=+b.dataset.t;bot()}));
document.querySelectorAll(".cb").forEach(b=>b.addEventListener("click",()=>{C=b.dataset.c;q.value="";fil()}));
document.querySelectorAll(".it").forEach(b=>b.addEventListener("click",()=>add(b.dataset.n,b.dataset.p)));
q.addEventListener("input",fil);dg.onclick=()=>custom("Diverse Getränke");ds.onclick=()=>custom("Diverse Speisen");
u.onclick=()=>{if(S[T]?.length)S[T].pop();sv();bot()};cl.onclick=()=>{if(confirm("T"+T+" wirklich leeren?")){S[T]=[];sv();bot()}};
pay.onclick=()=>{var a=S[T]||[];alert("T"+T+"\n\n"+sm(a).join("\n")+"\n\nGESAMT: "+euro(a.reduce((s,x)=>s+x.p,0)))};pr.onclick=()=>window.print();fil();bot();
</script></body></html>
